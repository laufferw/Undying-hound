<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3eaee"/>
      <stop offset="1" stop-color="#f3f1ec"/>
    </linearGradient>
    <linearGradient id="ginger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d08140"/>
      <stop offset="1" stop-color="#b9682b"/>
    </linearGradient>
    <linearGradient id="earG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8763b"/>
      <stop offset="1" stop-color="#aa5c27"/>
    </linearGradient>
    <path id="bodyPath" d="M150,352 C220,322 330,298 405,296 C442,295 466,318 466,352 C466,392 456,426 432,442 C380,454 300,454 240,462 C190,470 124,460 110,420 C100,382 118,362 150,352 Z"/>
    <clipPath id="bodyClip"><use href="#bodyPath"/></clipPath>
    <path id="earPath" d="M474,180 C454,186 444,212 446,244 C448,270 460,286 476,284 C494,282 502,258 502,234 C502,208 494,184 474,180 Z"/>
    <clipPath id="earClip"><use href="#earPath"/></clipPath>
  </defs>

  <rect width="640" height="560" fill="url(#sky)"/>
  <path d="M0,452 C200,444 420,450 640,446 L640,560 L0,560 Z" fill="#e7e1d6"/>
  <ellipse cx="290" cy="474" rx="230" ry="12" fill="#cdc4b5" opacity="0.8"/>

  <!-- tail: ginger base, long white rest -->
  <path d="M124,444 C96,458 70,466 40,468" stroke="#fbf8f4" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M124,444 C114,450 104,454 94,458" stroke="#b9682b" stroke-width="15" fill="none" stroke-linecap="round"/>

  <!-- far front leg -->
  <path d="M414,420 L416,462" stroke="#ece6de" stroke-width="22" stroke-linecap="round"/>
  <ellipse cx="426" cy="468" rx="17" ry="7" fill="#ece6de"/>

  <!-- body -->
  <use href="#bodyPath" fill="#fbf8f4"/>
  <g clip-path="url(#bodyClip)">
    <!-- ginger rump -->
    <path d="M90,330 L176,330 C186,360 186,392 176,420 C168,440 150,452 120,456 L90,456 Z" fill="url(#ginger)"/>
    <!-- saddle across the back, white shoulder in front of it -->
    <path d="M200,300 L392,280 C390,316 380,350 364,382 C346,412 318,424 284,424 C252,424 226,412 208,398 C202,370 200,336 200,300 Z" fill="url(#ginger)"/>
  </g>
  <!-- folded hind leg -->
  <ellipse cx="208" cy="430" rx="40" ry="32" fill="#fbf8f4"/>
  <ellipse cx="256" cy="466" rx="32" ry="9" fill="#fbf8f4"/>
  <path d="M266,460 v9 M276,460 v9" stroke="#e0d6cb" stroke-width="1.5"/>

  <!-- near front leg, white with freckles -->
  <path d="M440,410 L442,462" stroke="#fbf8f4" stroke-width="24" stroke-linecap="round"/>
  <ellipse cx="452" cy="469" rx="20" ry="8" fill="#fbf8f4"/>
  <g fill="#c77a3e" opacity="0.8">
    <circle cx="436" cy="432" r="2"/><circle cx="446" cy="446" r="1.6"/><circle cx="439" cy="456" r="1.8"/>
    <circle cx="458" cy="468" r="2"/><circle cx="464" cy="470" r="1.5"/>
  </g>
  <path d="M448,470 v6 M456,471 v6 M464,470 v5" stroke="#e0d6cb" stroke-width="1.5"/>

  <!-- neck: white all the way round -->
  <path d="M398,300 C410,268 430,236 456,214 L520,232 C512,268 492,310 466,348 C440,340 414,322 398,300 Z" fill="#fbf8f4"/>

  <!-- grey-green collar -->
  <path d="M426,262 C448,274 478,278 506,270 L500,290 C474,298 444,294 418,282 Z" fill="#7d8268"/>
  <path d="M428,268 C450,278 476,282 504,276" stroke="#a4a88c" stroke-width="2" fill="none"/>
  <rect x="494" y="270" width="14" height="22" rx="3" transform="rotate(-10 501 281)" fill="#2e2e2c"/>

  <!-- head: all ginger, looking up -->
  <g transform="rotate(-26 490 190)">
    <ellipse cx="486" cy="190" rx="42" ry="36" fill="url(#ginger)"/>
    <path d="M506,172 C540,170 568,176 586,184 C594,192 592,208 580,214 C560,222 532,224 510,220 Z" fill="#cd7c3a"/>
    <path d="M500,220 C530,230 560,226 580,216 C564,232 530,238 502,230 Z" fill="#f0dcc6"/>
    <path d="M580,180 C592,178 600,186 598,196 C596,204 586,206 578,202 C572,196 572,184 580,180 Z" fill="#8c4f45"/>
    <ellipse cx="590" cy="185" rx="3.5" ry="2" fill="#b07a70"/>
    <path d="M582,208 C566,216 548,218 534,216" stroke="#8a5a4c" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="512" cy="176" rx="11" ry="10" fill="#e3a58c"/>
    <circle cx="513" cy="176" r="8.5" fill="#2a1a10"/>
    <circle cx="516" cy="172" r="2.8" fill="#ffffff"/>
    <path d="M500,164 C508,158 520,158 526,164" stroke="#a85a26" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- floppy ear with dappled freckles -->
  <use href="#earPath" fill="url(#earG)"/>
  <g clip-path="url(#earClip)" fill="#8e4519" opacity="0.5">
    <circle cx="462" cy="226" r="3.5"/><circle cx="476" cy="212" r="3"/><circle cx="486" cy="236" r="4"/>
    <circle cx="466" cy="254" r="4.5"/><circle cx="488" cy="262" r="3.5"/><circle cx="476" cy="276" r="3.5"/>
    <circle cx="496" cy="218" r="2.5"/><circle cx="456" cy="270" r="2.5"/>
  </g>
  <path d="M468,196 C460,226 462,258 472,280" stroke="#8e4519" stroke-width="1.5" fill="none" opacity="0.4"/>

  <text x="320" y="526" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#7a7468" font-style="italic">Romeo</text>
</svg>
